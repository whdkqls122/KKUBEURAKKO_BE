name: "✨ Feature"
description: "새로운 기능을 추가합니다."
title: "[Feature]: "
labels: ["✨ Feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: "📄 배경"
      description: "왜 이 기능이 필요한지 적어주세요."
      placeholder: "예) 계좌이체 환불이 실제로 처리됐는지 관리자 화면에서 확인할 수 없다."
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 내용"
      placeholder: |
        - [ ] 환불 이체 완료 상태 추가
        - [ ] 이체 처리 API 추가
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: "🌐 API 설계"
      description: "추가하거나 바뀌는 API가 있다면 적어주세요."
      placeholder: |
        PATCH /v1/admin/orders/{orderId}/refund-transfer
        요청: { "amount": 18000, "transferredAt": "2026-10-19T15:00:00" }
        응답: 200

  - type: textarea
    id: done
    attributes:
      label: "🏁 완료 조건"
      description: "어떻게 되면 끝난 건지 적어주세요."
      placeholder: "예) 환불 주문 상세에 처리자·금액·이체 일시가 보인다."
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "🙋🏻 참고 자료"