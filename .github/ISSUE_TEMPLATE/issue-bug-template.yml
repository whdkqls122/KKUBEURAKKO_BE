name: "🐞 Bug"
description: "오류나 예상과 다른 동작을 기록합니다."
title: "[Bug]: "
labels: ["🐞 Bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "🐛 문제 요약"
      placeholder: "예) 새벽 1시에 매장 주문 목록을 조회하면 전날 영업 중 들어온 주문이 보이지 않는다."
    validations:
      required: true

  - type: input
    id: api
    attributes:
      label: "🌐 관련 API"
      placeholder: "예) GET /v1/orders/{storeId}/orders?status=PENDING"

  - type: dropdown
    id: environment
    attributes:
      label: "💻 발생 환경"
      options:
        - "로컬"
        - "테스트 코드"
        - "운영 서버"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔄 재현 절차"
      description: "요청 값까지 적어주면 다시 확인하기 쉬워요."
      placeholder: |
        1. 영업시간 18:00~02:00으로 설정
        2. 23:00에 주문 생성
        3. 다음 날 01:00에 매장 주문 목록 조회
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ 기대 결과"
      placeholder: "예) 23:00 주문이 목록에 보인다."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ 실제 결과"
      placeholder: "예) 빈 목록이 반환된다. (HTTP 200)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "📜 로그·에러 메시지"
      description: "개인정보와 토큰은 지우고 붙여주세요."
      render: shell

  - type: textarea
    id: cause
    attributes:
      label: "🔎 원인 추정"
      placeholder: "예) `getOrdersByStoreAndStatus`가 오늘 요일 기준으로 영업시간을 조회한다."

  - type: textarea
    id: references
    attributes:
      label: "🙋🏻 참고 자료"