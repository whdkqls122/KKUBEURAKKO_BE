name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app .

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app

  run-docker-image-on-ec2:
    needs: build-docker-image
    runs-on: self-hosted

    steps:
      - name: docker pull
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app

      - name: stop & remove existing container
        run: |
          if [ $(sudo docker ps -a -q -f name=kkubeurakko-app) ]; then
            sudo docker stop kkubeurakko-app
            sudo docker rm kkubeurakko-app
          fi

      - name: docker run new container
        run: |
          sudo docker run -d \
            -p 8080:8080 \
            --name kkubeurakko-app \
            -e DB_URL="${{ secrets.DB_URL }}" \
            -e DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -e REDIS_HOST="${{ secrets.REDIS_HOST }}" \
            -e REDIS_PORT="${{ secrets.REDIS_PORT }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e JWT_ACCESS_EXP="${{ secrets.JWT_ACCESS_EXP }}" \
            -e JWT_REFRESH_EXP="${{ secrets.JWT_REFRESH_EXP }}" \
            -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
            -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
            -e KAKAO_REDIRECT_URI="${{ secrets.KAKAO_REDIRECT_URI }}" \
            -e NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
            -e NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
            -e NAVER_REDIRECT_URI="${{ secrets.NAVER_REDIRECT_URI }}" \
            -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            -e GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}" \
            -e AES_SECRET="${{ secrets.AES_SECRET }}" \
            -e PORT_ONE_REQUEST_URL="${{ secrets.AES_SECRET }}" \
            -e PORT_ONE_STORE_ID="${{ secrets.PORT_ONE_STORE_ID }}" \
            -e PORT_ONE_SECRET="${{ secrets.PORT_ONE_SECRET }}" \
            -e PORT_ONE_PAYMENT_CHANNEL_KEY="${{ secrets.PORT_ONE_PAYMENT_CHANNEL_KEY }}" \
            -e PORT_ONE_VERIFY_CHANNEL_KEY="${{ secrets.PORT_ONE_VERIFY_CHANNEL_KEY }}" \
            -e AWS_REGION="${{ secrets.AWS_REGION }}" \
            -e AWS_BUCKET_NAME="${{ secrets.AWS_BUCKET_NAME }}" \
            -e AWS_CLOUDFRONT_DOMAIN="${{ secrets.AWS_CLOUDFRONT_DOMAIN }}" \
            -e AWS_CREDENTIALS_ACCESS_KEY="${{ secrets.AWS_CREDENTIALS_ACCESS_KEY }}" \
            -e AWS_CREDENTIALS_SECRET_KEY="${{ secrets.AWS_CREDENTIALS_SECRET_KEY }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app

      - name: cleanup docker
        run: sudo docker system prune -f
