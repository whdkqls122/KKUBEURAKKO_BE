name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5 # v3.1.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Spring Boot 어플리케이션 Build
      - name: Build with Gradle Wrapper
        run: ./gradlew build -x test

      # Docker 이미지 Build
      - name: docker image build
        run: |
          docker build \
            --build-arg DB_URL="${{ secrets.DB_URL }}" \
            --build-arg DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            --build-arg DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --build-arg REDIS_HOST="${{ secrets.REDIS_HOST }}" \
            --build-arg REDIS_PORT="${{ secrets.REDIS_PORT }}" \
            --build-arg JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --build-arg JWT_ACCESS_EXP="${{ secrets.JWT_ACCESS_EXP }}" \
            --build-arg JWT_REFRESH_EXP="${{ secrets.JWT_REFRESH_EXP }}" \
            --build-arg KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
            --build-arg KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
            --build-arg KAKAO_REDIRECT_URI="${{ secrets.KAKAO_REDIRECT_URI }}" \
            --build-arg NAVER_CLIENT_ID="${{ secrets.NAVER_CLIENT_ID }}" \
            --build-arg NAVER_CLIENT_SECRET="${{ secrets.NAVER_CLIENT_SECRET }}" \
            --build-arg NAVER_REDIRECT_URI="${{ secrets.NAVER_REDIRECT_URI }}" \
            --build-arg GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --build-arg GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --build-arg GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}" \
            --build-arg AES_SECRET="${{ secrets.AES_SECRET }}" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app .

      # DockerHub Login (push 하기 위해)
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Docker hub 로 push
      - name: Docker Hub push
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app

  # 위 과정에서 푸시한 이미지를 ec2에서 풀받아서 실행
  run-docker-image-on-ec2:
    needs: build-docker-image
    runs-on: self-hosted

    steps:
      - name: docker pull
        run: sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app

      - name: docker stop container
        run: |
          if [ $(sudo docker ps -a -q -f name=kkubeurakko-app) ]; then
            sudo docker stop kkubeurakko-app
          fi

      - name: docker run new container
        run: sudo docker run --rm -it -d -p 8080:8080 --name kkubeurakko-app ${{ secrets.DOCKERHUB_USERNAME }}/kkubeurakko-app

      - name: delete old docker image
        run: sudo docker system prune -f
