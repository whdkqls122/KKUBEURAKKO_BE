spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # 접속 정보(url·host·port)는 IntegrationTestSupport가 컨테이너 주소로 채운다
  data:
    redis:
      password: ""

  # 테스트 전용 더미 값 (Base64로 32바이트: AES-256·HS256 키 길이 충족)
  jwt:
    secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    access-token-expiry: 600000
    admin-access-token-expiry: 600000
    refresh-token-expiry: 1209600000
    temp-token-expiry: 600000

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: account_email, profile_nickname
          naver:
            client-name: Naver
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: email, nickname
          google:
            client-name: Google
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            authorization-grant-type: authorization_code
            scope: email, profile
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

    cookie:
      domain: localhost

    aes:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    phone-hash:
      secret: dGVzdC1waG9uZS1oYXNoLWtleS0zMi1ieXRlcy1vayE=

    kakao:
      refresh-url: https://kauth.kakao.com/oauth/token
      unlink-url: https://kapi.kakao.com/v1/user/unlink
      validate-token-url: https://kapi.kakao.com/v1/user/access_token_info
    naver:
      refresh-url: https://nid.naver.com/oauth2.0/token
      unlink-url: https://nid.naver.com/oauth2.0/token
      validate-token-url: https://openapi.naver.com/v1/nid/me
    google:
      refresh-url: https://oauth2.googleapis.com/token
      unlink-url: https://oauth2.googleapis.com/revoke
      validate-token-url: https://oauth2.googleapis.com/tokeninfo

  portOne:
    request-uri: http://localhost:65535
    store-id: store-test
    secret-key: test-portone-secret
    payment:
      channel-key: test-payment-channel
    verify:
      channel-key: test-verify-channel

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: test-bucket
    cloudfront:
      domain: test.cloudfront.net
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key

admin:
  initial:
    id: admin
    password: admin1234

cors:
  allowed-origins: http://localhost:5173

# 통합 테스트에서는 주기 작업을 끈다
scheduling:
  enabled: false