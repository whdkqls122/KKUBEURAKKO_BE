spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hibernate.default_batch_fetch_size: 100
    defer-datasource-initialization: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: ${JWT_ACCESS_EXP:3600000}
    refresh-token-expiry: ${JWT_REFRESH_EXP:604800000}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              account_email, profile_nickname
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
              email, nickname
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: ${NAVER_REDIRECT_URI}
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              email, profile
            client-name: Google
            authorization-grant-type: authorization_code
            redirect-uri: ${GOOGLE_REDIRECT_URI}
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: kakao_account
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent

    aes:
      secret: ${AES_SECRET}

    kakao:
      refresh-url: https://kauth.kakao.com/oauth/token
      unlink-url: https://kapi.kakao.com/v1/user/unlink
    naver:
      refresh-url: https://nid.naver.com/oauth2.0/token
      unlink-url: https://nid.naver.com/oauth2.0/token
    google:
      refresh-url: https://oauth2.googleapis.com/token
      unlink-url: https://oauth2.googleapis.com/revoke

  portOne:
    request-uri: ${PORT_ONE_REQUEST_URL}
    store-id: ${PORT_ONE_STORE_ID}
    secret-key: ${PORT_ONE_SECRET}
    payment:
      channel-key: ${PORT_ONE_PAYMENT_CHANNEL_KEY}
    verify:
      channel-key: ${PORT_ONE_VERIFY_CHANNEL_KEY}

cloud:
  aws:
    region: ${AWS_REGION}
    s3:
      bucket: ${AWS_BUCKET_NAME}
    cloudfront:
      domain: ${AWS_CLOUDFRONT_DOMAIN}
    credentials:
      access-key: ${AWS_CREDENTIALS_ACCESS_KEY}
      secret-key: ${AWS_CREDENTIALS_SECRET_KEY}