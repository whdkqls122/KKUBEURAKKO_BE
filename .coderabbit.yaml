# CodeRabbit 설정 - 꾸브라꼬 리팩토링용
language: "ko-KR"

reviews:
  profile: "assertive"
  poem: false

  path_instructions:
    - path: "**/*.java"
      instructions: |
        이 저장소는 실운영했던 비대면 주문 서비스(Spring Boot)를 리팩토링하는 중이다.
        기능 추가보다 구조 개선과 안정성 위주로 리뷰하고, 문제의 이유와 개선 방법을 함께 제시하며 가능하면 수정 코드 예시를 붙인다.
        코멘트 앞에 심각도를 표시한다: [필수] 버그·보안·데이터 정합성, [권장] 구조·가독성, [참고] 취향 수준.

        [리팩토링]
        - Controller의 비즈니스 로직, 책임이 과한 Service, Entity 직접 반환(DTO 미분리)을 지적한다.
        - 중복 코드, 매직 넘버, 30줄 이상 긴 메서드는 분리 방향을 제안한다.
        - 기존 동작(응답 형식, 상태 코드, 예외 메시지)이 바뀌면 반드시 지적한다.

        [트랜잭션·결제·주문]
        - 외부 API 호출(PG 결제·취소)이 트랜잭션 안에 있으면 지적한다.
        - 트랜잭션 안에서 예외를 catch하고 삼켜 롤백이 안 되는 코드는 [필수]로 지적한다.
        - 결제 성공 후 주문 처리 실패 시 결제 취소가 보장되는지, @TransactionalEventListener phase가 맞는지 본다.
        - 결제·환불 금액을 서버에서 재검증하는지, 중복 결제·주문 가능성(멱등성)을 확인한다.

        [JPA·성능]
        - N+1 가능성이 보이면 fetch join, @EntityGraph, batch size를 제안한다.
        - 양방향 연관관계에서 편의 메서드 없이 한쪽만 세팅하는 코드를 지적한다.
        - 조회 메서드에 @Transactional(readOnly = true)가 없으면 제안한다.
        - Redis 캐시(메뉴·옵션)는 데이터 변경 시 캐시 무효화가 되는지 확인한다.

        [인증·보안·개인정보]
        - JWT Access/Refresh, 소셜 토큰의 만료·재발급·로그아웃 시 Redis 삭제 누락을 확인한다.
        - 비밀키·API 키 하드코딩은 [필수]로 지적한다.
        - 개인정보(이름, 전화번호, 주소)가 암호화 저장되는지, 로그에 평문으로 남지 않는지 확인한다.
        - 다른 사용자의 주문·장바구니·주소에 접근 가능한 권한 검증 누락을 확인한다.

        [예외·테스트]
        - 전역 예외 처리와 커스텀 예외로 일관되게 처리하는지, catch 후 무시하는 코드가 없는지 본다.
        - 결제·주문·환불·인증 로직 수정 PR에 테스트가 없으면 테스트 추가를 제안한다.

    - path: "**/src/test/**"
      instructions: |
        테스트가 실제로 검증하려는 동작을 확인하는지, 성공 케이스만 있고 실패·예외 케이스가 빠지지 않았는지 본다.

    - path: "**/*.{yml,yaml,properties}"
      instructions: |
        비밀번호, 키, 토큰 같은 민감 정보가 평문으로 들어 있으면 [필수]로 지적하고 환경 변수 사용을 제안한다.